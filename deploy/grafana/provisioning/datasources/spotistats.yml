apiVersion: 1
datasources:
  - name: SpotiStats
    uid: spotistats
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_ro
    isDefault: true
    editable: false
    jsonData:
      database: spotistats
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
